<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo NLP-Cartographer Sandbox — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Add Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <h1>Demo NLP-Cartographer Sandbox</h1>
    <p>A label-based system demo: every language × task pair carries a coverage status. See what's built, and what isn't yet.</p>
  </div>
<div class="toggle">
  <button id="btnBoth" class="active">Map + list</button>
  <button id="btnMap">Map only</button>
  <button id="btnList">List only</button>
</div>
</header>

<div class="layout">
  <aside>
    <div class="field">
      <label for="search">Search</label>
      <input type="search" id="search" placeholder="Language, country, task…">
    </div>
    <div class="section-label">Primary labels</div>
    <div class="field">
      <label>Status</label>
      <div class="chips" id="statusChips"></div>
    </div>
    <div class="field">
      <label>Task</label>
      <div class="chips" id="taskChips"></div>
    </div>
    <div class="field">
      <label>Country</label>
      <div class="chips" id="countryChips"></div>
    </div>
    <div class="field">
      <label>Endangerment</label>
      <div class="chips" id="endChips"></div>
    </div>

    <div class="section-label">Community labels</div>
    <div class="field">
      <div class="tagcloud" id="communityChips"></div>
    </div>

    <button class="reset" id="resetBtn">Reset filters</button>
  </aside>

  <main>
    <div class="mapwrap" id="mapwrap">
      <!-- Replaced SVG with Leaflet container -->
      <div id="map"></div>
      <p class="note">Interactive boundary map — click a country to filter.</p>
    </div>

    <div class="results-head">
      <h2>Coverage results</h2>
      <span id="resultCount"></span>
    </div>
    <div id="resultsArea"><div class="loading">Loading data.json…</div></div>
  </main>
</div>

<!-- Add Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
