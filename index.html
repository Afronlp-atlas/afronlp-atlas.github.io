<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa NLP Sandbox — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <h1>Africa NLP Sandbox</h1>
    <p>A label-based demo: every language × task pair carries a coverage status. See what's built, and what isn't yet.</p>
  </div>
  <div class="toggle">
    <button id="btnMap" class="active">Map + list</button>
    <button id="btnList">List only</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="field">
      <label for="search">Search</label>
      <input type="search" id="search" placeholder="Language, country, task…">
    </div>
    <div class="field">
      <label>Status</label>
      <div class="chips" id="statusChips"></div>
    </div>
    <div class="field">
      <label for="taskSel">Task</label>
      <select id="taskSel"><option value="">All tasks</option></select>
    </div>
    <div class="field">
      <label for="countrySel">Country</label>
      <select id="countrySel"><option value="">All countries</option></select>
    </div>
    <div class="field">
      <label for="endSel">Endangerment</label>
      <select id="endSel">
        <option value="">All</option>
        <option value="stable">Stable</option>
        <option value="vulnerable">Vulnerable</option>
      </select>
    </div>
    <button class="reset" id="resetBtn">Reset filters</button>
  </aside>

  <main>
    <div class="mapwrap" id="mapwrap">
      <svg id="africaMap" viewBox="0 0 500 500" role="img" aria-label="Schematic map of demo countries"></svg>
      <p class="note">Schematic positions for this demo (not precise cartography) — click a country to filter.</p>
    </div>

    <div class="results-head">
      <h2>Coverage results</h2>
      <span id="resultCount"></span>
    </div>
    <div id="resultsArea"><div class="loading">Loading data.json…</div></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
