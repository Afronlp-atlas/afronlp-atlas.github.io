<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa NLP Sandbox — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EE; --panel:#FFFFFF; --ink:#1E2432; --ink-soft:#5B6472;
  --line:#E4DCC8; --accent:#B4772A; --accent-soft:#F1E3CC;
  --untouched:#9AA3AF; --dataset:#D99A34; --benchmark:#3E79A8; --covered:#4C9A63;
  --shadow: 0 1px 2px rgba(30,36,50,.06), 0 6px 18px rgba(30,36,50,.06);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171A22; --panel:#1F232E; --ink:#EDEFF4; --ink-soft:#A7ADBA;
    --line:#323847; --accent:#E3A05A; --accent-soft:#3A2E1C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#171A22; --panel:#1F232E; --ink:#EDEFF4; --ink-soft:#A7ADBA;
  --line:#323847; --accent:#E3A05A; --accent-soft:#3A2E1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; min-height:100vh; }
h1,h2,h3{ font-family:'Spectral', Georgia, serif; font-weight:600; margin:0; }
header{ padding:28px clamp(16px,4vw,48px) 18px; border-bottom:1px solid var(--line); display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
header h1{ font-size:clamp(22px,3vw,30px); }
header p{ margin:4px 0 0; color:var(--ink-soft); font-size:14px; max-width:52ch; }
.toggle{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex-shrink:0; }
.toggle button{ border:none; background:var(--panel); color:var(--ink-soft); padding:9px 18px; font-family:inherit; font-size:13.5px; cursor:pointer; transition:.15s; }
.toggle button.active{ background:var(--accent); color:#fff; }
.layout{ display:grid; grid-template-columns:250px 1fr; gap:0; max-width:1240px; margin:0 auto; }
aside{ padding:24px 20px; border-right:1px solid var(--line); }
.field{ margin-bottom:22px; }
.field label{ display:block; font-size:12px; letter-spacing:.02em; color:var(--ink-soft); margin-bottom:8px; }
input[type="search"], select{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); font-family:inherit; font-size:13.5px; }
.chips{ display:flex; flex-direction:column; gap:6px; }
.chip{ display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:13px; background:var(--panel); user-select:none; }
.chip .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.chip.off{ opacity:.4; }
.chip .count{ margin-left:auto; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.reset{ width:100%; padding:8px; border:1px solid var(--line); background:transparent; color:var(--ink-soft); border-radius:8px; font-family:inherit; font-size:12.5px; cursor:pointer; }
main{ padding:24px clamp(16px,3vw,32px) 60px; min-width:0; }
.mapwrap{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:22px; position:relative; }
.mapwrap .note{ font-size:11.5px; color:var(--ink-soft); margin:8px 2px 0; }
svg#africaMap{ width:100%; height:auto; display:block; }
.marker{ cursor:pointer; }
.marker circle{ stroke:var(--panel); stroke-width:2; transition:.15s; }
.marker:hover circle{ stroke:var(--accent); }
.marker text{ font-size:11px; fill:var(--ink); font-family:'IBM Plex Sans', sans-serif; pointer-events:none; }
.marker.selected circle{ stroke:var(--accent); stroke-width:3; }
.results-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; gap:12px; flex-wrap:wrap;}
.results-head h2{ font-size:17px; }
.results-head span{ color:var(--ink-soft); font-size:13px; }
table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
th,td{ text-align:left; padding:10px 12px; font-size:13.5px; border-bottom:1px solid var(--line); }
th{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:500; background:var(--accent-soft); }
tr:last-child td{ border-bottom:none; }
.badge{ display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; }
.badge .dot{ width:8px; height:8px; border-radius:50%; }
.badge.status{ background:var(--accent-soft); }
a.rlink{ color:var(--accent); text-decoration:none; font-size:13px; }
a.rlink:hover{ text-decoration:underline; }
.empty, .loading{ padding:30px; text-align:center; color:var(--ink-soft); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
@media (max-width:760px){
  .layout{ grid-template-columns:1fr; }
  aside{ border-right:none; border-bottom:1px solid var(--line); }
  table, thead, tbody, th, td, tr{ display:block; }
  thead{ display:none; }
  tr{ border-bottom:1px solid var(--line); padding:10px 12px; }
  td{ border:none; padding:3px 0; display:flex; justify-content:space-between; gap:10px; }
  td::before{ content:attr(data-label); color:var(--ink-soft); font-size:11.5px; }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Africa NLP Sandbox</h1>
    <p>A label-based demo: every language × task pair carries a coverage status. See what's built, and what isn't yet.</p>
  </div>
  <div class="toggle">
    <button id="btnMap" class="active">Map + list</button>
    <button id="btnList">List only</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="field">
      <label for="search">Search</label>
      <input type="search" id="search" placeholder="Language, country, task…">
    </div>
    <div class="field">
      <label>Status</label>
      <div class="chips" id="statusChips"></div>
    </div>
    <div class="field">
      <label for="taskSel">Task</label>
      <select id="taskSel"><option value="">All tasks</option></select>
    </div>
    <div class="field">
      <label for="countrySel">Country</label>
      <select id="countrySel"><option value="">All countries</option></select>
    </div>
    <div class="field">
      <label for="endSel">Endangerment</label>
      <select id="endSel">
        <option value="">All</option>
        <option value="stable">Stable</option>
        <option value="vulnerable">Vulnerable</option>
      </select>
    </div>
    <button class="reset" id="resetBtn">Reset filters</button>
  </aside>

  <main>
    <div class="mapwrap" id="mapwrap">
      <svg id="africaMap" viewBox="0 0 500 500" role="img" aria-label="Schematic map of demo countries"></svg>
      <p class="note">Schematic positions for this demo (not precise cartography) — click a country to filter.</p>
    </div>

    <div class="results-head">
      <h2>Coverage results</h2>
      <span id="resultCount"></span>
    </div>
    <div id="resultsArea"><div class="loading">Loading data.json…</div></div>
  </main>
</div>

<script>
const STATUS_META = {
  untouched:{label:'Untouched', color:'var(--untouched)'},
  dataset_only:{label:'Dataset only', color:'var(--dataset)'},
  benchmark_only:{label:'Benchmark only', color:'var(--benchmark)'},
  covered:{label:'Covered', color:'var(--covered)'},
};

let LANGUAGES=[], COUNTRIES=[], TASKS=[], RESOURCES=[], MATRIX=[];

const state = {
  search:'', statuses:new Set(Object.keys(STATUS_META)), task:'', country:'', end:'', mapVisible:true,
};

// Reads the labels.primary structure from data.json
function buildMatrix(){
  const rows = [];
  for(const lang of LANGUAGES){
    for(const task of TASKS){
      const matches = RESOURCES.filter(r =>
        r.labels.primary.task === task && r.labels.primary.language.includes(lang.id)
      );
      let status = 'untouched';
      if(matches.some(r=>r.labels.primary.status==='covered')) status='covered';
      else if(matches.some(r=>r.labels.primary.status==='benchmark_only')) status='benchmark_only';
      else if(matches.some(r=>r.labels.primary.status==='dataset_only')) status='dataset_only';
      rows.push({lang, task, status, resources: matches});
    }
  }
  return rows;
}

function filteredRows(){
  const q = state.search.trim().toLowerCase();
  return MATRIX.filter(r=>{
    if(!state.statuses.has(r.status)) return false;
    if(state.task && r.task!==state.task) return false;
    if(state.country && r.lang.country!==state.country) return false;
    if(state.end && r.lang.endangerment!==state.end) return false;
    if(q){
      const hay = (r.lang.name+' '+r.lang.country+' '+r.task+' '+r.resources.map(x=>x.name).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

const chipsEl = document.getElementById('statusChips');
function renderChips(){
  const counts = {};
  for(const k in STATUS_META) counts[k]=0;
  for(const r of MATRIX) counts[r.status]++;
  chipsEl.innerHTML='';
  for(const [key,meta] of Object.entries(STATUS_META)){
    const on = state.statuses.has(key);
    const el = document.createElement('div');
    el.className = 'chip'+(on?'':' off');
    el.innerHTML = `<span class="dot" style="background:${meta.color}"></span>${meta.label}<span class="count">${counts[key]}</span>`;
    el.onclick = ()=>{
      if(state.statuses.has(key)) state.statuses.delete(key); else state.statuses.add(key);
      renderAll();
    };
    chipsEl.appendChild(el);
  }
}

const taskSel = document.getElementById('taskSel');
const countrySel = document.getElementById('countrySel');

function populateSelects(){
  TASKS.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; taskSel.appendChild(o); });
  COUNTRIES.forEach(c=>{ const o=document.createElement('option'); o.value=c.name; o.textContent=c.name; countrySel.appendChild(o); });
}
function wireControls(){
  taskSel.onchange = ()=>{ state.task=taskSel.value; renderAll(); };
  countrySel.onchange = ()=>{ state.country=countrySel.value; renderAll(); };
  document.getElementById('endSel').onchange = (e)=>{ state.end=e.target.value; renderAll(); };
  document.getElementById('search').oninput = (e)=>{ state.search=e.target.value; renderAll(); };
  document.getElementById('resetBtn').onclick = ()=>{
    state.search=''; state.statuses=new Set(Object.keys(STATUS_META)); state.task=''; state.country=''; state.end='';
    document.getElementById('search').value=''; taskSel.value=''; countrySel.value=''; document.getElementById('endSel').value='';
    renderAll();
  };
  document.getElementById('btnMap').onclick = ()=>{ state.mapVisible=true; syncToggle(); renderAll(); };
  document.getElementById('btnList').onclick = ()=>{ state.mapVisible=false; syncToggle(); renderAll(); };
}
function syncToggle(){
  document.getElementById('btnMap').classList.toggle('active', state.mapVisible);
  document.getElementById('btnList').classList.toggle('active', !state.mapVisible);
  document.getElementById('mapwrap').style.display = state.mapVisible ? '' : 'none';
}

const lonMin=-20, lonMax=52, latMin=-35, latMax=40, W=500,H=500,M=30;
function project(lat,lon){
  const x = M + (lon-lonMin)/(lonMax-lonMin) * (W-2*M);
  const y = M + (latMax-lat)/(latMax-latMin) * (H-2*M);
  return [x,y];
}

function renderMap(){
  const svg = document.getElementById('africaMap');
  svg.innerHTML='';
  const rows = filteredRows();
  for(const c of COUNTRIES){
    const [x,y] = project(c.lat, c.lon);
    const countryRows = rows.filter(r=>r.lang.country===c.name);
    const allCountryRows = MATRIX.filter(r=>r.lang.country===c.name);
    const covered = countryRows.filter(r=>r.status!=='untouched').length;
    const ratio = allCountryRows.length ? covered/allCountryRows.length : 0;
    let fill = 'var(--untouched)';
    if(ratio>=0.6) fill='var(--covered)';
    else if(ratio>=0.25) fill='var(--dataset)';
    const langCount = LANGUAGES.filter(l=>l.country===c.name).length;
    const r = 10 + langCount*2;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','marker'+(state.country===c.name?' selected':''));
    g.innerHTML = `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"></circle>
      <text x="${x}" y="${y+r+13}" text-anchor="middle">${c.name}</text>
      <text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="10">${countryRows.length}</text>`;
    g.onclick = ()=>{
      state.country = state.country===c.name ? '' : c.name;
      countrySel.value = state.country;
      renderAll();
    };
    svg.appendChild(g);
  }
}

function renderResults(){
  const rows = filteredRows();
  document.getElementById('resultCount').textContent = `${rows.length} of ${MATRIX.length} language × task pairs shown`;
  const area = document.getElementById('resultsArea');
  if(rows.length===0){
    area.innerHTML = `<div class="empty">No matches — try widening your filters.</div>`;
    return;
  }
  const rowsHtml = rows.map(r=>{
    const meta = STATUS_META[r.status];
    const links = r.resources.length
      ? r.resources.map(res=>{
          const url = Object.values(res.refer_to)[0];
          return `<a class="rlink" href="${url}" target="_blank" rel="noopener">${res.name} ↗</a>`;
        }).join('<br>')
      : '<span style="color:var(--ink-soft)">—</span>';
    return `<tr>
      <td data-label="Language">${r.lang.name}</td>
      <td data-label="Country">${r.lang.country}</td>
      <td data-label="Task">${r.task}</td>
      <td data-label="Status"><span class="badge status"><span class="dot" style="background:${meta.color}"></span>${meta.label}</span></td>
      <td data-label="Endangerment">${r.lang.endangerment==='vulnerable' ? '<span class="badge" style="background:var(--accent-soft)">Vulnerable</span>' : 'Stable'}</td>
      <td data-label="Resource">${links}</td>
    </tr>`;
  }).join('');
  area.innerHTML = `<table>
    <thead><tr><th>Language</th><th>Country</th><th>Task</th><th>Status</th><th>Endangerment</th><th>Resource</th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

function renderAll(){
  renderChips();
  if(state.mapVisible) renderMap();
  renderResults();
}

async function init(){
  try{
    const res = await fetch('./data.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    LANGUAGES = data.languages; COUNTRIES = data.countries; TASKS = data.tasks; RESOURCES = data.resources;
    MATRIX = buildMatrix();
    populateSelects();
    wireControls();
    syncToggle();
    renderAll();
  }catch(err){
    document.getElementById('resultsArea').innerHTML =
      `<div class="empty">Couldn't load data.json (${err.message}). If you're opening this file directly (file://), browsers block local fetch() — run a local server instead, e.g. <code>python -m http.server</code>, or view it once pushed to GitHub Pages.</div>`;
  }
}
init();
</script>
</body>
</html>
